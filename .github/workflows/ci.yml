name: CI

on:
  push:
  pull_request:

# One running job per branch is enough, older runs are stopped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The daemon toolchain in gradle/gradle-daemon-jvm.properties requires JDK 25.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships a Node, but pinning it keeps the cspell run reproducible.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check code style
        run: ./gradlew ktlintCheck

      # The whole codebase is English, so an English spell checker is meaningful here.
      - name: Check spelling
        run: >
          npx --yes cspell@10 lint -c .github/cspell.json --no-progress
          "**/*.{kt,kts,xml,yml,yaml,md,toml}"

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Build
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # On a red run the reports are the first thing anyone wants to see.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
